name: Daddy's Game Workshop QA

on:
  push:
    branches: [main]
    paths:
      - "games/**"
      - "scripts/qa_games.py"
      - ".github/workflows/game-qa.yml"
  pull_request:
    paths:
      - "games/**"
      - "scripts/qa_games.py"
      - ".github/workflows/game-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-qa:
    name: Check game HTML and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Daddy's Game Workshop QA
        run: python scripts/qa_games.py
