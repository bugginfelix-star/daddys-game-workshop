<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Gemma's Game Folder</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  color:white;
  background:
    radial-gradient(circle at 20% 15%,#57f7ff44,transparent 28%),
    radial-gradient(circle at 80% 20%,#ff5fd744,transparent 25%),
    linear-gradient(180deg,#08031c,#02030a);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.card{
  width:min(720px,100%);
  background:linear-gradient(180deg,#172456,#0a1128);
  border:4px solid #57f7ff;
  border-radius:28px;
  padding:22px;
  box-shadow:0 18px 45px #0009,0 0 28px #57f7ff55;
  text-align:center;
}
h1{
  margin:0 0 10px;
  font-size:clamp(34px,9vw,64px);
  color:#ffe66d;
  text-shadow:3px 3px 0 #000;
}
p{
  font-size:18px;
  line-height:1.4;
  color:#dbe7ff;
  font-weight:800;
}
a{
  display:block;
  margin-top:16px;
  padding:14px;
  border-radius:18px;
  background:linear-gradient(180deg,#ffdf6d,#b36d16);
  border:3px solid #fff2a8;
  color:#2b1600;
  text-decoration:none;
  font-size:18px;
  font-weight:1000;
}
.small{
  margin-top:16px;
  font-size:14px;
  color:#c8d8ff;
}
</style>
</head>
<body>
<div class="card">
  <h1>🦄 Gemma's Games</h1>
  <p>This is Gemma's game folder. When Gemma makes a game, its current playable version can live here.</p>
  <p>Each game should get its own folder with an <strong>index.html</strong> file inside it.</p>
  <a href="../../">⬅️ Back to Daddy's Game Workshop</a>
  <div class="small">Example path: games/gemma/game-name/index.html</div>
</div>
</body>
</html>
