<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Gemma's Pet Dress Up</title>
<style>
:root{
  --ink:#503b62;--muted:#78698a;--pink:#ff78b0;--pink2:#ffd3e5;--cream:#fff9ee;
  --mint:#a9ecd7;--sky:#afe6ff;--gold:#ffd96c;--lav:#d6c2ff;--card:#fffdf8f3;
  --shadow:0 12px 30px rgba(80,59,98,.18);--soft:0 5px 0 rgba(80,59,98,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#f8d8e8;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}button:active{transform:translateY(2px)}
.hidden{display:none!important}
#app{width:100%;height:100dvh;max-width:1100px;margin:auto;overflow:hidden;position:relative;background:linear-gradient(#ffd7e9 0 19%,#e9faff 19% 67%,#fbe8cb 67%);display:flex;flex-direction:column}
.room{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.room:before{content:"";position:absolute;left:0;right:0;top:18%;height:49%;background:linear-gradient(#effcff,#e7fbff);border-top:3px solid #fff;box-shadow:inset 0 -12px 0 rgba(133,101,135,.07)}
.room:after{content:"";position:absolute;left:-7%;right:-7%;bottom:-12%;height:46%;background:repeating-linear-gradient(90deg,#f4d9ad 0 35px,#e8c997 35px 38px);transform:skewY(-2deg);transform-origin:left top;border-top:5px solid #e3bf8f}
.wallDot{position:absolute;border-radius:50%;background:#fff8;box-shadow:18px 11px #fff5,-15px 27px #fff6,29px 38px #fff4}
.wallDot.d1{left:8%;top:24%;width:5px;height:5px}.wallDot.d2{right:12%;top:30%;width:6px;height:6px}
.shelf{position:absolute;right:4%;top:27%;width:94px;height:15px;border-radius:8px;background:#b98b69;box-shadow:0 6px 0 #8e694f}
.shelf:before,.shelf:after{content:"";position:absolute;bottom:15px;border-radius:50% 50% 30% 30%;background:#ff8db9;border:4px solid #fff;width:26px;height:31px}.shelf:before{left:10px}.shelf:after{left:52px;background:#86d6ff}
.plant{position:absolute;left:4%;top:45%;width:56px;height:70px}.plant:before{content:"";position:absolute;bottom:0;left:11px;width:34px;height:28px;background:#e8a76f;border-radius:5px 5px 14px 14px;box-shadow:inset 0 4px #ffc694}.plant:after{content:"";position:absolute;bottom:21px;left:8px;width:42px;height:44px;background:radial-gradient(ellipse at 15% 70%,#66b86d 0 28%,transparent 30%),radial-gradient(ellipse at 45% 45%,#77c87c 0 31%,transparent 33%),radial-gradient(ellipse at 75% 68%,#5ca765 0 30%,transparent 32%)}
.mirrorDec,.lightsDec,.rackDec{display:none;position:absolute}.room.has-mirror .mirrorDec{display:block;left:6%;top:27%;width:53px;height:67px;border:7px solid #ff9fc7;border-radius:50% 50% 44% 44%;background:linear-gradient(135deg,#e9fbff,#bfe3f4);box-shadow:0 5px 0 #d776a1}.room.has-lights .lightsDec{display:block;left:16%;right:16%;top:21%;height:22px;border-top:3px solid #886585}.room.has-lights .lightsDec:before{content:"✦  ✦  ✦  ✦  ✦  ✦  ✦";position:absolute;left:0;right:0;top:-9px;color:#ffd45f;text-align:center;font-size:18px;text-shadow:0 0 8px #fff}.room.has-goldRack .rackDec{display:block;right:8%;top:44%;width:80px;height:70px;border:6px solid #d9a92f;border-bottom:0;border-radius:12px 12px 0 0}.room.has-goldRack .rackDec:before{content:"◆  ●  ▲";position:absolute;left:-4px;right:-4px;top:15px;text-align:center;color:#ff7da9;font-size:17px}.room.rainbow-plant .plant:after{background:radial-gradient(ellipse at 15% 70%,#ff7aa6 0 28%,transparent 30%),radial-gradient(ellipse at 45% 45%,#7edbb0 0 31%,transparent 33%),radial-gradient(ellipse at 75% 68%,#7ac9ff 0 30%,transparent 32%)}

.topbar{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(180deg,#fff8,#fff3);backdrop-filter:blur(10px);border-bottom:1px solid #fff}
.brand{display:flex;align-items:center;gap:8px;min-width:0}.logoMark{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,#ff81b7,#a98bff);box-shadow:var(--soft);position:relative;flex:0 0 auto}.logoMark:before{content:"";position:absolute;width:17px;height:14px;left:10px;top:13px;background:#fff;border-radius:60% 60% 55% 55%}.logoMark i,.logoMark b{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;top:6px}.logoMark i{left:7px}.logoMark b{right:7px}
.brandText{min-width:0}.brandText strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brandText span{font-size:10px;color:var(--muted);font-weight:800}
.stats{display:flex;gap:5px}.statPill{min-width:52px;padding:5px 8px;border-radius:14px;background:#fff9;border:2px solid #fff;font-weight:1000;font-size:11px;text-align:center;box-shadow:var(--soft)}.statPill b{display:block;font-size:9px;color:var(--muted)}

.main{position:relative;z-index:2;flex:1;min-width:0;width:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(235px,1fr) auto;gap:6px;padding:7px 8px calc(8px + env(safe-area-inset-bottom))}
.requestCard{min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:var(--card);border:3px solid #fff;border-radius:20px;padding:8px 10px;box-shadow:var(--shadow)}
.customerFace{width:48px;height:48px;border-radius:50%;background:linear-gradient(#ffe7cd,#ffc69c);border:3px solid #fff;box-shadow:0 3px 0 #e1aac0;position:relative;overflow:hidden}.customerFace:before{content:"";position:absolute;left:7px;right:7px;top:8px;height:18px;border-radius:50% 50% 35% 35%;background:var(--hair,#75503e)}.customerFace:after{content:"• ᴗ •";position:absolute;left:0;right:0;top:21px;text-align:center;font-size:12px;font-weight:1000;color:#5f473f}
.requestText{min-width:0}.requestText .hello{font-size:10px;color:var(--muted);font-weight:900}.requestText h2{font-size:14px;margin:1px 0 2px}.requestText p{margin:0;font-size:11px;line-height:1.2;font-weight:800}.clues{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.clue{font-size:9px;font-weight:1000;border-radius:999px;padding:3px 6px;background:#f5eaff;border:1px solid #d9c4ff}.clue.free{background:#dcf8eb;border-color:#96ddb9}
.topActions{display:flex;flex-direction:column;gap:4px}.iconBtn{border:0;border-radius:13px;background:#fff;padding:7px 8px;min-width:45px;box-shadow:var(--soft);font-size:10px;font-weight:1000}

.stageWrap{min-width:0;position:relative;min-height:235px;border-radius:28px;overflow:hidden;background:linear-gradient(#dff9ff 0 66%,#f8dfba 66%);border:4px solid #fff;box-shadow:var(--shadow)}
.stageWrap:before{content:"";position:absolute;left:10%;right:10%;bottom:4%;height:24%;border-radius:50%;background:#f5cfa2;box-shadow:inset 0 8px #f9dfbd}
.stageWrap:after{content:"";position:absolute;left:50%;bottom:8%;width:64%;height:10%;transform:translateX(-50%);border-radius:50%;background:#8c6b8b1b}
.petStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none}
.petSvg{width:min(77vw,380px);height:min(48vh,370px);max-width:95%;max-height:94%;overflow:visible;filter:drop-shadow(0 12px 9px rgba(83,64,87,.18));transition:transform .18s ease}.petSvg.happy{animation:petHappy .7s ease}.petSvg.react{animation:petReact .45s ease}.petSvg.petBounce{animation:petBounce .7s ease infinite alternate}
@keyframes petHappy{0%{transform:scale(1)}25%{transform:translateY(-12px) rotate(-4deg) scale(1.03)}50%{transform:translateY(0) rotate(4deg)}75%{transform:translateY(-8px) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes petReact{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}@keyframes petBounce{to{transform:translateY(-5px)}}
.stageLabel{position:absolute;left:9px;top:9px;border-radius:13px;padding:5px 8px;background:#fffbdcdd;border:2px solid #fff;font-size:10px;font-weight:1000;box-shadow:var(--soft)}
.petMood{position:absolute;right:9px;top:9px;border-radius:13px;padding:5px 8px;background:#fff9;border:2px solid #fff;font-size:10px;font-weight:1000}
.dragHint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:9px;font-weight:900;color:#745c79;background:#fff9;border-radius:999px;padding:4px 8px;opacity:.9;white-space:nowrap}
.charm{position:absolute;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;filter:drop-shadow(0 2px 2px #6d536655);touch-action:none;cursor:grab;user-select:none;z-index:9}.charm:active{cursor:grabbing;transform:scale(1.08)}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none;animation:spark .8s ease-out forwards;z-index:20}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

.closet{min-width:0;width:100%;background:var(--card);border:3px solid #fff;border-radius:24px;padding:6px 7px 8px;box-shadow:var(--shadow);min-height:182px;max-height:245px;display:flex;flex-direction:column;gap:5px}
.tabs{min-width:0;max-width:100%;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border:0;border-radius:13px;background:#f2e6f7;padding:7px 10px;font-size:10px;font-weight:1000}.tab.active{background:linear-gradient(#ff8cbd,#ff6aa7);color:#fff;box-shadow:0 4px 0 #d64b86}
.optionGrid{min-width:0;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;overflow-y:auto;min-height:0;padding:1px}.option{position:relative;border:2px solid #eaddec;border-radius:15px;background:#fff;padding:5px 3px;min-height:55px;text-align:center;font-size:9px;font-weight:1000;box-shadow:0 2px 0 #eaddec}.option .swatch{width:27px;height:27px;border-radius:10px;margin:0 auto 3px;border:2px solid #fff;box-shadow:0 0 0 1px #d7c5db}.option .miniIcon{display:block;font-size:22px;line-height:26px}.option.selected{border-color:#ff78b0;background:#fff0f6;box-shadow:0 3px 0 #ff9ac3}.option.locked{filter:grayscale(.4);opacity:.58}.lock{position:absolute;right:2px;top:2px;font-size:9px;border-radius:7px;background:#513e5d;color:#fff;padding:2px 4px}.newBadge{position:absolute;left:2px;top:2px;font-size:7px;background:#ffd96c;border-radius:6px;padding:2px 3px;color:#674416}
.bottomRow{min-width:0;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.bottomRow>*{min-width:0}.bigBtn{min-width:0;min-height:52px;border:0;border-radius:18px;font-size:12px;font-weight:1000;box-shadow:0 5px 0 #caa8b8;background:#fff;padding:6px 4px;white-space:normal;overflow:hidden}.bigBtn.finish{background:linear-gradient(#ffd96c,#ffb853);color:#643d14;box-shadow:0 5px 0 #d99635}.bigBtn.shop{background:linear-gradient(#b8f0db,#84dabd);color:#2a5a49;box-shadow:0 5px 0 #5db397}.bigBtn.newPet{background:linear-gradient(#d7c7ff,#b9a1f2);color:#4b3f72;box-shadow:0 5px 0 #9177cd}

.overlay{position:absolute;inset:0;z-index:60;background:#593c6d99;backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:16px}.panel{width:min(620px,100%);max-height:94%;overflow:auto;background:#fffaf2;border:4px solid #fff;border-radius:28px;box-shadow:0 25px 65px #4f335077;padding:16px;text-align:center}.panel h1,.panel h2{margin:4px 0 8px}.panel p{font-size:13px;font-weight:750;line-height:1.35;margin:7px 0}.heroTitle{font-size:clamp(30px,9vw,52px);line-height:.94;background:linear-gradient(90deg,#ff65a4,#9b7df0,#48b8d8);-webkit-background-clip:text;color:transparent;text-shadow:0 4px #fff}.subtitle{color:var(--muted);font-size:12px;font-weight:900}.startPet{width:210px;height:145px;margin:auto;position:relative}.startPet .bubble{position:absolute;border-radius:50%;background:#ffd1df;border:4px solid #fff;box-shadow:var(--shadow)}.startPet .b1{width:105px;height:95px;left:45px;top:30px}.startPet .b2,.startPet .b3{width:49px;height:56px;top:17px}.startPet .b2{left:31px;transform:rotate(-24deg)}.startPet .b3{right:31px;transform:rotate(24deg)}.startPet .eyes{position:absolute;left:75px;top:67px;font-size:31px;font-weight:1000;letter-spacing:10px}.startPet .mouth{position:absolute;left:91px;top:92px;font-size:25px}.startBtn{width:100%;border:0;border-radius:20px;padding:15px;background:linear-gradient(#ff8dbd,#ff68a7);color:#fff;font-size:17px;font-weight:1000;box-shadow:0 6px 0 #d94c86;margin-top:8px}.smallBtn{border:0;border-radius:15px;padding:9px 12px;background:#ede3f6;font-weight:1000;font-size:11px;margin:3px}.danger{background:#ffd9df;color:#8f3349}.rewardBurst{font-size:54px;animation:rewardPop .55s ease}@keyframes rewardPop{0%{transform:scale(.4) rotate(-8deg)}70%{transform:scale(1.14) rotate(4deg)}100%{transform:scale(1)}}
.scoreStars{font-size:34px;letter-spacing:4px}.reaction{font-size:15px;font-weight:1000;color:#7c4d85}.rewardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.rewardBox{background:#f3eafd;border-radius:15px;padding:9px 5px;font-weight:1000;font-size:11px}.rewardBox b{display:block;font-size:17px;color:#d34d88}
.shopGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.shopCard{border:2px solid #e7d7eb;border-radius:17px;padding:8px;background:#fff;text-align:left}.shopCard strong{font-size:12px}.shopCard p{font-size:9px;margin:4px 0;color:var(--muted)}.buyBtn{border:0;border-radius:12px;padding:7px;background:#ffe287;font-weight:1000;font-size:10px;width:100%}.buyBtn:disabled{opacity:.45}.progressBar{height:12px;border-radius:999px;background:#eadff0;overflow:hidden;margin:5px 0}.progressBar i{display:block;height:100%;background:linear-gradient(90deg,#ff73ac,#a478ed);border-radius:999px}
.showGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.showPet{background:linear-gradient(#eafaff,#fbe7ca);border:3px solid #fff;border-radius:20px;padding:6px;box-shadow:var(--soft)}.showPet svg{width:100%;height:130px}.showBanner{font-size:16px;font-weight:1000;color:#9a4f92;background:#fff0f8;border-radius:15px;padding:8px;margin:7px 0}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-15px;width:8px;height:15px;border-radius:3px;animation:fall var(--dur) linear forwards;transform:rotate(var(--rot));background:var(--c)}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}

@media(max-height:700px){.requestCard{padding:5px 8px}.customerFace{width:40px;height:40px}.main{gap:4px;padding-top:4px}.stageWrap{min-height:205px}.closet{min-height:160px;max-height:205px}.bigBtn{min-height:45px}.option{min-height:48px}.option .miniIcon{font-size:19px}.petSvg{height:min(42vh,315px)}}
@media(min-width:700px){.main{grid-template-columns:minmax(340px,1.1fr) minmax(350px,.9fr);grid-template-rows:auto 1fr auto}.requestCard{grid-column:1/-1}.stageWrap{grid-column:1;grid-row:2/4}.closet{grid-column:2;grid-row:2;max-height:none}.bottomRow{grid-column:2;grid-row:3}.optionGrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app">
  <div class="room" id="room"><i class="wallDot d1"></i><i class="wallDot d2"></i><i class="shelf"></i><i class="plant"></i><i class="mirrorDec"></i><i class="lightsDec"></i><i class="rackDec"></i></div>
  <header class="topbar">
    <div class="brand"><span class="logoMark"><i></i><b></b></span><span class="brandText"><strong>Gemma's Pet Dress Up</strong><span id="buildLabel">Boutique Build 1.0</span></span></div>

  <main class="main">
    <section class="requestCard">
      <div class="customerFace" id="customerFace"></div>
      <div class="requestText"><div class="hello" id="customerHello">Today's customer</div><h2 id="petName">Meet Poppy!</h2><p id="requestLine">Make this pet look adorable.</p><div class="clues" id="clues"></div></div>
      <div class="topActions"><button class="iconBtn" id="soundBtn">SOUND ✓</button><button class="iconBtn" id="helpBtn">HELP</button></div>
    </section>
    <section class="stageWrap" id="stageWrap">
      <div class="stageLabel" id="stageLabel">Poppy • Dog</div><div class="petMood" id="petMood">happy!</div>
      <div class="petStage" id="petStage"><svg class="petSvg" id="petSvg" viewBox="0 0 320 320" aria-label="pet makeover"></svg></div>
      <div class="dragHint">Drag your decorations anywhere on the pet ✦</div>
    </section>
    <section class="closet"><div class="tabs" id="tabs"></div><div class="optionGrid" id="optionGrid"></div></section>
    <section class="bottomRow"><button class="bigBtn shop" id="shopBtn">Shop</button><button class="bigBtn finish" id="finishBtn">Finish ✨</button><button class="bigBtn newPet" id="randomBtn">Free Style</button></section>
  </main>
  <div class="overlay" id="overlay"></div>
  <div class="confetti hidden" id="confetti"></div>
</div>

function renderOptions(){
 let list;if(activeTab==="color")list=colors;else if(activeTab==="pattern")list=patterns;else list=categories[activeTab];
 els.grid.innerHTML=list.map(o=>{const lock=!unlocked(o);const selected=activeTab==="color"?outfit.color===o.id:activeTab==="pattern"?outfit.pattern===o.id:activeTab==="decor"?false:outfit[activeTab]===o.id;let inner="";
  if(activeTab==="color")inner=`<span class="swatch" style="background:${o.hex==="linear"?"linear-gradient(135deg,#ff6fa9,#ffd65f,#78dba7,#70c8ff,#b694ed)":o.hex}"></span>`;else inner=`<span class="miniIcon">${o.icon}</span>`;
  return `<button class="option ${selected?"selected":""} ${lock?"locked":""}" data-id="${o.id}">${lock?`<span class="lock">Lv ${o.level}</span>`:""}${recentlyUnlocked(o)?'<span class="newBadge">NEW</span>':""}${inner}<span>${o.name}</span></button>`}).join("");
 els.grid.querySelectorAll(".option").forEach(b=>b.onclick=()=>chooseOption(b.dataset.id));
}
function chooseOption(id){
 let list=activeTab==="color"?colors:activeTab==="pattern"?patterns:categories[activeTab];const o=list.find(x=>x.id===id);if(!o)return;if(!unlocked(o)){sound("no");popText(`Unlocks at Level ${o.level}`);return}
 if(activeTab==="decor"){if(dragCharms.length>=5){popText("Up to 5 decorations!");return}dragCharms.push({type:id,color:outfit.accent,x:.48+(Math.random()-.5)*.14,y:.38+(Math.random()-.5)*.12});}
 else if(activeTab==="color")outfit.color=id;else if(activeTab==="pattern")outfit.pattern=id;else outfit[activeTab]=id;
 sound("tap");petReact();renderPet();renderOptions();
}
function popText(t){els.mood.textContent=t;clearTimeout(popText.t);popText.t=setTimeout(()=>els.mood.textContent=appointment?.royal?"royal guest!":"happy!",1300)}
function petReact(){els.petSvg.classList.remove("react");void els.petSvg.offsetWidth;els.petSvg.classList.add("react");sparkles(8)}
function sparkles(n=12){const r=els.stage.getBoundingClientRect();for(let i=0;i<n;i++){const s=document.createElement("i");s.className="spark";s.style.left=(45+Math.random()*20)+"%";s.style.top=(38+Math.random()*25)+"%";s.style.setProperty("--dx",`${(Math.random()-.5)*120}px`);s.style.setProperty("--dy",`${(Math.random()-.5)*100}px`);s.style.background=["#fff","#ffd55f","#ff85b5","#99e4d0","#bda5ff"][i%5];els.stage.appendChild(s);setTimeout(()=>s.remove(),850)}}
function scoreLook(){
 const r=appointment.request;if(r.free)return{score:100,hits:1,total:1,label:"Creative Star!"};
 const chosen=[outfit.outfit,outfit.head,outfit.neck,outfit.face,outfit.extra].map((id,i)=>{const cat=["outfit","head","neck","face","extra"][i];return categories[cat].find(x=>x.id===id)}).filter(Boolean);
 const tagSet=new Set(chosen.flatMap(x=>x.tags));patterns.find(x=>x.id===outfit.pattern)?.tags.forEach(t=>tagSet.add(t));dragCharms.forEach(ch=>categories.decor.find(x=>x.id===ch.type)?.tags.forEach(t=>tagSet.add(t)));
 let hits=0,total=0;for(const tag of r.tags||[]){total++;if(tag==="match"){if(outfit.color===outfit.accent||[outfit.color,outfit.accent].includes("rainbow"))hits++;else if(chosen.filter(x=>x.id!=="none").length>=2&&outfit.color!=="rose")hits+=.65}else if(tagSet.has(tag))hits++}
 if(r.colorIds){total++;if(r.colorIds.includes(outfit.color)||r.colorIds.includes(outfit.accent))hits++}
 if(r.pattern){total++;if(outfit.pattern===r.pattern)hits++}
 if(r.headIds){total++;if(r.headIds.includes(outfit.head))hits++}
 if(r.hard){total++;if(dragCharms.length>=1&&outfit.head!=="none"&&outfit.neck!=="none")hits++}
 const score=Math.round(50+50*(total?hits/total:1));return{score,hits,total,label:score>=92?"Perfect Match!":score>=78?"Great Match!":"Cute Creation!"};
}
function finishMakeover(){
 const result=scoreLook();sound(result.score>=90?"great":"finish");els.petSvg.classList.add("happy");sparkles(24);setTimeout(()=>showResult(result),520);
}
function showResult(result){
 if(appointment.royal){royal.looks.push(snapshotLook());royal.scores.push(result.score);if(royal.index<3){els.overlay.classList.remove("hidden");els.overlay.innerHTML=`<div class="panel"><div class="rewardBurst">✨</div><h2>${result.label}</h2><p>${appointment.pet} is ready for the runway!</p><div class="scoreStars">${stars(result.score)}</div><p>Royal look ${royal.index+1} of 4 complete.</p><button class="startBtn" id="nextRoyal">Next Royal Pet</button></div>`;$("#nextRoyal").onclick=()=>{els.overlay.classList.add("hidden");royal.index++;loadRoyalPet()};return}else{completeRoyalShow();return}}
 const base=18,bonus=Math.round((result.score-50)/5),earned=base+Math.max(0,bonus);save.coins+=earned;save.totalMakeovers++;const oldLevel=save.level;save.level++;
 const newUnlocks=getUnlocks(save.level);persist();updateStats();
 els.overlay.classList.remove("hidden");els.overlay.innerHTML=`<div class="panel"><div class="rewardBurst">${result.score>=92?"🌟":"✨"}</div><h2>${result.label}</h2><div class="scoreStars">${stars(result.score)}</div><p class="reaction">${customerReaction(result.score)}</p><div class="rewardGrid"><div class="rewardBox"><b>+${earned}</b>Coins</div><div class="rewardBox"><b>${save.level}</b>New Level</div><div class="rewardBox"><b>${result.score}%</b>Style Match</div></div>${newUnlocks.length?`<div class="showBanner">Unlocked: ${newUnlocks.slice(0,3).join(" • ")}</div>`:""}<button class="startBtn" id="nextCustomer">Next Customer</button></div>`;
 confetti(result.score>=90?36:18);$("#nextCustomer").onclick=()=>{els.overlay.classList.add("hidden");if(save.level===135&&!save.royalComplete)startRoyal();else makeAppointment()};
}
function stars(score){return score>=94?"★★★★★":score>=84?"★★★★☆":score>=70?"★★★☆☆":"★★☆☆☆"}
function customerReaction(score){return score>=94?`${appointment.customer}: “WOW! This is exactly what I dreamed of!”`:score>=84?`${appointment.customer}: “I love it! ${appointment.pet} looks amazing!”`:score>=70?`${appointment.customer}: “So cute! What a fun makeover!”`:`${appointment.customer}: “Aww! ${appointment.pet} looks happy!”`}
function snapshotLook(){return{species:appointment.species.id,pet:appointment.pet,outfit:structuredClone(outfit),charms:structuredClone(dragCharms)}}
function getUnlocks(level){const all=[...colors,...patterns,...Object.values(categories).flat(),...species];return all.filter(x=>x.level===level).map(x=>x.name)}
function completeRoyalShow(){
 const avg=Math.round(royal.scores.reduce((a,b)=>a+b,0)/royal.scores.length);save.royalComplete=true;save.coins+=250;save.level=136;save.totalMakeovers++;persist();updateStats();sound("royal");
 els.overlay.classList.remove("hidden");els.overlay.innerHTML=`<div class="panel"><div class="rewardBurst">👑</div><h1>Royal Pet Fashion Show!</h1><div class="showBanner">Level 135 Complete • ${avg}% average style match</div><div class="showGrid">${royal.looks.map((l,i)=>`<div class="showPet">${miniPetSvg(l)}<strong>${l.pet}</strong><br><span>${royal.scores[i]}%</span></div>`).join("")}</div><p>All four pets walk the runway together while the crowd cheers!</p><div class="rewardGrid"><div class="rewardBox"><b>+250</b>Coins</div><div class="rewardBox"><b>136</b>Level</div><div class="rewardBox"><b>ROYAL</b>Stylist</div></div><button class="startBtn" id="royalDone">Keep Styling!</button></div>`;confetti(80);$("#royalDone").onclick=()=>{royal=null;els.overlay.classList.add("hidden");makeAppointment()};
}
function miniPetSvg(l){const sp=species.find(s=>s.id===l.species)||species[0];const old=outfit;outfit=l.outfit;const html=`<svg viewBox="0 0 320 320"><defs>${patternDef(outfit.pattern,colorHex(outfit.color),colorHex(outfit.accent))}</defs>${petBase(sp,sp.fur)}${outfitSvg()}</svg>`;outfit=old;return html}
function confetti(n=30){els.confetti.innerHTML="";els.confetti.classList.remove("hidden");for(let i=0;i<n;i++){const x=document.createElement("i");x.style.left=Math.random()*100+"%";x.style.setProperty("--dur",(1.8+Math.random()*1.7)+"s");x.style.setProperty("--rot",Math.random()*180+"deg");x.style.setProperty("--c",["#ff6fa8","#ffd45f","#7ed9c2","#77c9f2","#b895ec"][i%5]);x.style.animationDelay=Math.random()*.5+"s";els.confetti.appendChild(x)}setTimeout(()=>els.confetti.classList.add("hidden"),3600)}
function showShop(){
 els.overlay.classList.remove("hidden");const next=getNextUnlocks();els.overlay.innerHTML=`<div class="panel"><h2>Gemma's Boutique</h2><p>You have <strong>${save.coins} coins</strong>. Clothes and pet choices unlock by completing makeovers. Coins decorate your shop!</p><div class="progressBar"><i style="width:${Math.min(100,(save.level%10)*10)}%"></i></div><p class="subtitle">Next level unlocks: ${next.join(" • ")||"More surprises soon!"}</p><div class="shopGrid">${shopItems.map(s=>`<div class="shopCard"><strong>${save.bought.includes(s.id)?"✓ ":""}${s.name}</strong><p>${s.desc}</p><button class="buyBtn" data-buy="${s.id}" ${save.bought.includes(s.id)||save.coins<s.cost?"disabled":""}>${save.bought.includes(s.id)?"Owned":s.cost+" coins"}</button></div>`).join("")}</div><button class="smallBtn" id="closeShop">Back to Pet</button></div>`;
 els.overlay.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const s=shopItems.find(x=>x.id===b.dataset.buy);if(!s||save.bought.includes(s.id)||save.coins<s.cost)return;save.coins-=s.cost;save.bought.push(s.id);persist();sound("great");updateStats();showShop()});$("#closeShop").onclick=()=>els.overlay.classList.add("hidden");
}
function getNextUnlocks(){for(let l=save.level+1;l<=save.level+3;l++){const u=getUnlocks(l);if(u.length)return u.slice(0,4)}return[]}
function showHelp(){els.overlay.classList.remove("hidden");els.overlay.innerHTML=`<div class="panel"><h2>How to Play</h2><p><strong>1.</strong> Read the customer's request.</p><p><strong>2.</strong> Tap Clothes, Head, Neck, Face, Extras, Colors, and Patterns to build the look piece by piece.</p><p><strong>3.</strong> Add decorations and <strong>drag them anywhere on the pet</strong>.</p><p><strong>4.</strong> Finish the makeover. Every design earns progress; matching requests earns a little bonus.</p><p>Every fourth appointment is usually a <strong>Free Design</strong>. At <strong>Level 135</strong>, the Royal Pet Fashion Show begins!</p><button class="startBtn" id="helpBack">Got it!</button></div>`;$("#helpBack").onclick=()=>els.overlay.classList.add("hidden")}
function showStart(){
 els.overlay.classList.remove("hidden");els.overlay.innerHTML=`<div class="panel"><div class="startPet"><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i><span class="eyes">• •</span><span class="mouth">ᴗ</span></div><h1 class="heroTitle">PET<br>DRESS UP</h1><div class="subtitle">Made for Gemma • Boutique Build ${BUILD}</div><p>Customers bring you adorable pets. Mix clothes, colors, patterns, hats, bows, collars, glasses, and decorations to create their perfect look!</p><button class="startBtn" id="startBtn">Open the Boutique ✨</button><button class="smallBtn" id="resetBtn">Reset Progress</button></div>`;
 $("#startBtn").onclick=()=>{els.overlay.classList.add("hidden");sound("start");if(save.level===135&&!save.royalComplete)startRoyal();else makeAppointment()};$("#resetBtn").onclick=()=>{if(confirm("Reset Gemma's Pet Dress Up progress?")){localStorage.removeItem(SAVE_KEY);save=defaultSave();persist();updateStats();showStart()}};
}
function renderAll(){updateStats();renderRequest();renderTabs();renderOptions();renderPet();}
function sound(type){if(!save.sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime;const notes={tap:[520,.06],start:[660,.12],finish:[720,.12],great:[880,.16],no:[210,.08],royal:[784,.25]};let [f,d]=notes[type]||notes.tap;[0,1,2].slice(0,type==="royal"?3:1).forEach((n,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=f*(1+i*.25);g.gain.setValueAtTime(.08,now+i*.1);g.gain.exponentialRampToValueAtTime(.001,now+i*.1+d);o.connect(g).connect(audio.destination);o.start(now+i*.1);o.stop(now+i*.1+d+.02)})}catch(e){}}

els.finish.onclick=finishMakeover;els.shop.onclick=showShop;els.random.onclick=()=>{sound("tap");makeAppointment(true)};els.sound.onclick=()=>{save.sound=!save.sound;persist();updateStats();if(save.sound)sound("tap")};$("#helpBtn").onclick=showHelp;

showStart();updateStats();
})();
</script>
</body>
</html>
